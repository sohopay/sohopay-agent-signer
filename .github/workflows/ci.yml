name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Parity tests run here once @sohopay/signer-vectors is added as a dependency
      # (or SIGNER_VECTORS_PATH is provided); until then they skip cleanly while the
      # storage / terminal / idempotency suites gate every push.
      - name: Test
        run: npm test
